name: Deploy to GitHub Pages

# Runs on every push to main, so publishing is just `git push`.
# Also runnable by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs pages:write to publish and id-token:write for the
# deployment's OIDC attestation. Nothing here uses a personal credential.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish rather than being
# cancelled, so a half-published site is not left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # enablement: true turns Pages on for the repository if it is not
      # already, so this works on a fresh repo without visiting Settings.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      # GitHub Pages serves this repo at /silfrun/, so the base path has to
      # match or every internal link 404s. Both values come from the Pages
      # config above rather than being hardcoded.
      - name: Build
        run: npm run build:ci
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
