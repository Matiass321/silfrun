<!doctype html>
<meta charset="utf-8">
<title>a-filters clip test</title>
<style>
  body { background: #fff; font-family: system-ui, sans-serif; padding: 40px; }
  h2 { font-size: 13px; margin: 24px 0 8px; color: #666; font-weight: 600; }

  /* --- verbatim from src/styles/admin.css --- */
  .a-filters {
    display: flex;
    gap: 7px;
    margin-bottom: 12px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
  }
  .a-filters::-webkit-scrollbar { display: none; }

  .a-filter {
    display: inline-flex;
    align-items: center;
    height: 34px;
    padding: 0 13px;
    border: 1px solid #d8d8d8;
    border-radius: 999px;
    background: #fff;
    color: #333;
    font-size: 13.5px;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    flex: none;
  }

  /* .adm :focus-visible, verbatim geometry */
  .ring {
    outline: 2px solid #c0392b;
    outline-offset: 2px;
    border-radius: 3px;
  }

  /* control: same thing without the scroll container */
  .noscroll { overflow-x: visible; }
</style>

<h2>A. AS SHIPPED — .a-filters { overflow-x: auto; padding-bottom: 2px }</h2>
<nav class="a-filters" id="shipped">
  <a class="a-filter ring" href="#">Öll</a>
  <a class="a-filter" href="#">Bókað</a>
  <a class="a-filter ring" href="#">Lokið</a>
</nav>

<h2>B. CONTROL — identical, but overflow-x: visible</h2>
<nav class="a-filters noscroll">
  <a class="a-filter ring" href="#">Öll</a>
  <a class="a-filter" href="#">Bókað</a>
  <a class="a-filter ring" href="#">Lokið</a>
</nav>

<h2>C. PROPOSED FIX — padding-block: 4px (keeps overflow-x: auto)</h2>
<nav class="a-filters" style="padding-block:4px; padding-bottom:4px;">
  <a class="a-filter ring" href="#">Öll</a>
  <a class="a-filter" href="#">Bókað</a>
  <a class="a-filter ring" href="#">Lokið</a>
</nav>

<pre id="out" style="font:12px monospace; background:#f4f4f4; padding:12px; white-space:pre-wrap;"></pre>
<script>
  const n = document.getElementById('shipped');
  const cs = getComputedStyle(n);
  const first = n.firstElementChild;
  const report = {
    'computed overflow-x': cs.overflowX,
    'computed overflow-y': cs.overflowY,
    'is scroll container (y)': cs.overflowY !== 'visible',
    'container clientHeight (padding box)': n.clientHeight,
    'container scrollHeight': n.scrollHeight,
    'chip offsetHeight': first.offsetHeight,
    'chip offsetTop within container': first.offsetTop - n.offsetTop,
    'outline reaches above padding box by (px)': 4 - (first.offsetTop - n.offsetTop),
    'outline reaches below padding box by (px)':
      (first.offsetTop - n.offsetTop) + first.offsetHeight + 4 - n.clientHeight,
    'first chip left outline x (rel. scroll origin)': first.offsetLeft - n.offsetLeft - 4,
  };
  document.getElementById('out').textContent =
    Object.entries(report).map(([k, v]) => k.padEnd(46) + ' : ' + v).join('\n');
</script>
